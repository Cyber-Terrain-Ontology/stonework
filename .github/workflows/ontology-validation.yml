name: Ontology validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache RDF toolkit
        uses: actions/cache@v4
        with:
          path: tools/rdf-toolkit.jar
          key: rdf-toolkit-${{ runner.os }}-${{ hashFiles('tools/download-rdf-toolkit.sh') }}

      - name: Download RDF toolkit
        run: bash tools/download-rdf-toolkit.sh

      - name: Cache SHACL engine
        uses: actions/cache@v4
        with:
          path: |
            tools/bin
            tools/.crates.toml
            tools/.crates2.json
            ~/.cargo/registry
            ~/.cargo/git
          key: shacl-validator-${{ runner.os }}-${{ hashFiles('tools/install-shacl-validator.sh') }}

      - name: Build SHACL engine
        run: bash tools/install-shacl-validator.sh

      - name: Check Turtle formatting
        run: bash .githooks/format-ttl.sh --check

      - name: Check Turtle and OWL integrity
        run: python3 tools/check-ontology.py

      - name: Check SHACL constraints
        run: python3 tools/check-shacl.py
