repos:
  - repo: local
    hooks:
      - id: format-ttl
        name: Canonicalize TTL (rdf-toolkit)
        language: script
        entry: .githooks/format-ttl.sh
        files: \.ttl$
        pass_filenames: true

      - id: protect-catalog
        name: Protect catalog-v001.xml
        language: script
        entry: .githooks/protect-catalog.sh
        pass_filenames: false
        always_run: true

      - id: ontology-integrity
        name: Validate Turtle and OWL integrity
        language: system
        entry: python3 tools/check-ontology.py
        pass_filenames: false
        always_run: true
